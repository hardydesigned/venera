# Test-Konfiguration für contextLoads

# OAuth2: ClientRegistrationRepository wird nur erstellt wenn client-id/secret gesetzt sind
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.provider.google.authorization-uri=http://localhost/oauth2/authorize
spring.security.oauth2.client.provider.google.token-uri=http://localhost/oauth2/token
spring.security.oauth2.client.provider.google.user-info-uri=http://localhost/oauth2/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=http://localhost/oauth2/jwks
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Eigene Properties (überschreibt main)
# Base64-kodierter 256-Bit-Schlüssel für HS256 (32 Bytes)
hardytec.secret-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
hardytec.cors.allowed-origins=http://localhost:5173
hardytec.auth.oauth2.redirect-url=http://localhost:8080/auth/oauth2/code/google
jwt.refreshExpirationMs=1800000
hardytec.auth.ott.callbackUrl=http://localhost:8080/auth/oauth2/code/google
hardytec.callbackUrl-reset-password=http://localhost:8080/auth/reset-password
hardytec.mail.from=test@example.com
spring.mail.host=localhost

# H2 für Tests (ohne laufende PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway für H2-Tests deaktivieren (Migrations sind PostgreSQL-spezifisch)
spring.flyway.enabled=false

# JPA für H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
