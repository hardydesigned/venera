spring.application.name=venera

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/venera}
spring.datasource.username=${DB_USER:venera}
spring.datasource.password=${DB_PASSWORD:venera}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}

hardytec.secret-key=${SECRET_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
hardytec.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Nach OAuth-Erfolg: Redirect zur Frontend-Callback-Seite (mit JWT im Fragment)
hardytec.auth.oauth2.redirect-url=${OAUTH2_REDIRECT_URL:http://localhost:5173/auth/callback}

# OAuth2 Google (ClientRegistrationRepository) – echte Werte aus Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub
jwt.refreshExpirationMs=${REFRESH_EXPIRATION_MS:1800000}
hardytec.auth.ott.callbackUrl=${OAUTH2_CALLBACK_URL:http://localhost:8080/auth/oauth2/code/google}
hardytec.auth.ott.expiration-minutes=${OAUTH2_EXPIRATION_MINUTES:15}
hardytec.mail.from=${MAIL_FROM:noreply@example.com}
hardytec.callbackUrl-reset-password=${CALLBACK_URL_RESET_PASSWORD:http://localhost:5173/reset-password}
spring.mail.host=${MAIL_HOST:smtp.example.com}
